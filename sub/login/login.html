<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 / 회원가입 - 입덕볶이</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-wrap">
    <header class="site-header">
      <div class="header-left">
        <a href="../../index.html" class="btn-back" aria-label="뒤로가기">←</a>
        <a href="../../index.html" class="logo-link">
          <img src="../../Imgs/logo-mascot.png" alt="입덕볶이 로고" class="logo-img">
          <span class="logo-text">입덕볶이</span>
        </a>
      </div>
      <div class="header-actions">
        <a href="login.html" class="user-icon-btn is-logged-in" id="headerUserBtn" aria-label="로그인">
          <i data-lucide="user"></i>
        </a>
        <a href="../cart/cart.html" class="cart-icon-btn" aria-label="장바구니">
          <i data-lucide="shopping-cart"></i>
          <span class="cart-badge">0</span>
        </a>
        <button type="button" class="hamburger-btn" id="openMenuBtn" aria-label="전체 메뉴">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="slide-drawer" id="slideDrawer">
      <div>
        <div class="drawer-top">
          <div class="drawer-brand">
            <img src="../../Imgs/logo-mascot.png" alt="로고" class="logo-img">
            <span class="drawer-member-name" id="drawerUserName" hidden></span>
          </div>
          <button type="button" class="drawer-close" id="closeMenuBtn">&times;</button>
        </div>
        <nav class="drawer-nav">
          <a href="../lists/lists.html"><span>메뉴</span><span>›</span></a>
          <a href="#"><span>소개</span><span>›</span></a>
          <a href="#"><span>커뮤니티</span><span>›</span></a>
          <a href="login.html"><span>로그인</span><span>›</span></a>
          <a href="../mypage/mypage.html"><span>마이페이지</span><span>›</span></a>
        </nav>
      </div>
      <div class="drawer-footer">
        <strong>입덕볶이 고객센터</strong>
        영업시간 11:00 ~ 23:30
      </div>
    </aside>

    <main class="login-main">
      <section class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" id="tabLoginBtn" data-tab="login" role="tab" aria-selected="true">
            <i data-lucide="log-in"></i>
            <span>로그인</span>
          </button>
          <button type="button" class="auth-tab" id="tabSignupBtn" data-tab="signup" role="tab" aria-selected="false">
            <i data-lucide="user-plus"></i>
            <span>회원가입</span>
          </button>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="loginId">아이디</label>
            <div class="input-wrap">
              <i data-lucide="user"></i>
              <input type="text" id="loginId" name="loginId" placeholder="아이디를 입력해 주세요" required>
            </div>
          </div>

          <div class="form-group">
            <label for="loginPw">비밀번호</label>
            <div class="input-wrap">
              <i data-lucide="lock"></i>
              <input type="password" id="loginPw" name="loginPw" placeholder="비밀번호를 입력해 주세요" required>
              <button type="button" class="btn-toggle-pw" data-target="loginPw" aria-label="비밀번호 표시 전환">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="login-sub-options">
            <label class="checkbox-label">
              <input type="checkbox" id="keepLoginChk" checked>
              <span>로그인 상태 유지</span>
            </label>
            <button type="button" class="btn-find-help" id="findAccountBtn">아이디 / 비밀번호 찾기</button>
          </div>

          <p class="auth-feedback" id="loginFeedback" aria-live="polite"></p>

          <button type="submit" class="btn-action-red auth-submit-btn">
            <i data-lucide="log-in"></i>
            <span>로그인하기</span>
          </button>

          <div class="demo-account-box">
            <span>테스트용 간편 체험:</span>
            <button type="button" id="fillDemoAccountBtn" class="btn-demo-fill">
              데모 계정 자동입력
            </button>
          </div>
        </form>

        <!-- 회원가입 폼 -->
        <form id="signupForm" class="auth-form" hidden novalidate>
          <div class="form-group">
            <label for="signupNickname">닉네임</label>
            <div class="input-wrap">
              <i data-lucide="smile"></i>
              <input type="text" id="signupNickname" name="signupNickname" placeholder="예: 치즈떡볶이러버" required>
            </div>
          </div>

          <div class="form-group">
            <label for="signupId">아이디</label>
            <div class="input-wrap">
              <i data-lucide="user"></i>
              <input type="text" id="signupId" name="signupId" placeholder="4자 이상 아이디 입력" required>
            </div>
          </div>

          <div class="form-group">
            <label for="signupPw">비밀번호</label>
            <div class="input-wrap">
              <i data-lucide="lock"></i>
              <input type="password" id="signupPw" name="signupPw" placeholder="4자 이상 비밀번호 입력" required>
              <button type="button" class="btn-toggle-pw" data-target="signupPw" aria-label="비밀번호 표시 전환">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="signupPwConfirm">비밀번호 확인</label>
            <div class="input-wrap">
              <i data-lucide="shield-check"></i>
              <input type="password" id="signupPwConfirm" name="signupPwConfirm" placeholder="비밀번호를 한 번 더 입력해 주세요" required>
              <button type="button" class="btn-toggle-pw" data-target="signupPwConfirm" aria-label="비밀번호 확인 표시 전환">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="terms-box">
            <label class="checkbox-label">
              <input type="checkbox" id="agreeTermsChk">
              <span>[필수] 입덕볶이 이용약관 및 개인정보 처리방침 동의</span>
            </label>
          </div>

          <p class="auth-feedback" id="signupFeedback" aria-live="polite"></p>

          <button type="submit" class="btn-action-red auth-submit-btn">
            <i data-lucide="user-plus"></i>
            <span>회원가입 완료하기</span>
          </button>
        </form>

        <!-- SNS 간편로그인 (네이버 / 카카오) -->
        <div class="social-login-section">
          <div class="social-divider">
            <span>간편 로그인 / 시작하기</span>
          </div>
          <div class="social-btn-group">
            <button type="button" class="btn-social btn-kakao" id="kakaoLoginBtn">
              <span class="social-badge">K</span>
              <span>카카오로 3초 만에 시작하기</span>
            </button>
            <button type="button" class="btn-social btn-naver" id="naverLoginBtn">
              <span class="social-badge">N</span>
              <span>네이버로 간편 로그인</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../app.js"></script>
  <script>
    (function () {
      const USERS_KEY = 'ipdeok_users';
      const CURRENT_USER_KEY = 'ipdeok_current_user';
      const MYPAGE_URL = '../mypage/mypage.html';

      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabSignupBtn = document.getElementById('tabSignupBtn');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');

      const loginIdInput = document.getElementById('loginId');
      const loginPwInput = document.getElementById('loginPw');
      const loginFeedback = document.getElementById('loginFeedback');
      const fillDemoAccountBtn = document.getElementById('fillDemoAccountBtn');
      const findAccountBtn = document.getElementById('findAccountBtn');

      const signupNicknameInput = document.getElementById('signupNickname');
      const signupIdInput = document.getElementById('signupId');
      const signupPwInput = document.getElementById('signupPw');
      const signupPwConfirmInput = document.getElementById('signupPwConfirm');
      const agreeTermsChk = document.getElementById('agreeTermsChk');
      const signupFeedback = document.getElementById('signupFeedback');

      const kakaoLoginBtn = document.getElementById('kakaoLoginBtn');
      const naverLoginBtn = document.getElementById('naverLoginBtn');

      function getStoredUsers() {
        try {
          return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function saveStoredUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }

      function setActiveUser(userObj) {
        if (userObj) {
          localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(userObj));
        } else {
          localStorage.removeItem(CURRENT_USER_KEY);
        }
      }

      function switchTab(targetTab) {
        const isLogin = targetTab === 'login';
        tabLoginBtn.classList.toggle('active', isLogin);
        tabSignupBtn.classList.toggle('active', !isLogin);
        tabLoginBtn.setAttribute('aria-selected', String(isLogin));
        tabSignupBtn.setAttribute('aria-selected', String(!isLogin));

        loginForm.hidden = !isLogin;
        signupForm.hidden = isLogin;
        loginFeedback.textContent = '';
        signupFeedback.textContent = '';

        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      tabLoginBtn.addEventListener('click', () => switchTab('login'));
      tabSignupBtn.addEventListener('click', () => switchTab('signup'));

      // 비밀번호 표시 / 숨기기 토글
      document.querySelectorAll('.btn-toggle-pw').forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const inputEl = document.getElementById(targetId);
          if (!inputEl) return;
          const isPassword = inputEl.type === 'password';
          inputEl.type = isPassword ? 'text' : 'password';
          btn.innerHTML = isPassword ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        });
      });

      // 아이디 / 비밀번호 찾기 안내
      if (findAccountBtn) {
        findAccountBtn.addEventListener('click', () => {
          const users = getStoredUsers();
          if (users.length === 0) {
            loginFeedback.textContent = '가입된 계정이 없습니다. 아래 데모 계정 자동입력 또는 회원가입을 이용해 주세요.';
          } else {
            const sample = users[0];
            loginFeedback.textContent = `최근 등록 아이디 힌트: "${sample.id}" (비밀번호 분실 시 새 계정으로 간편 가입 가능)`;
          }
          loginFeedback.className = 'auth-feedback info';
        });
      }

      // 데모 계정 자동입력
      if (fillDemoAccountBtn) {
        fillDemoAccountBtn.addEventListener('click', () => {
          const users = getStoredUsers();
          const demoId = 'ipdeok01';
          const demoPw = '1234';
          if (!users.some((u) => u.id === demoId)) {
            users.push({ id: demoId, pw: demoPw, nickname: '입덕단골러', provider: '일반회원' });
            saveStoredUsers(users);
          }
          loginIdInput.value = demoId;
          loginPwInput.value = demoPw;
          loginFeedback.textContent = '데모 계정 정보가 입력되었습니다. 로그인하기를 눌러주세요.';
          loginFeedback.className = 'auth-feedback info';
        });
      }

      // 일반 회원가입
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const nickname = signupNicknameInput.value.trim();
        const id = signupIdInput.value.trim();
        const pw = signupPwInput.value.trim();
        const pwConfirm = signupPwConfirmInput.value.trim();

        if (!nickname) {
          signupFeedback.textContent = '닉네임을 입력해 주세요.';
          signupFeedback.className = 'auth-feedback error';
          signupNicknameInput.focus();
          return;
        }
        if (id.length < 4) {
          signupFeedback.textContent = '아이디는 4자 이상 입력해 주세요.';
          signupFeedback.className = 'auth-feedback error';
          signupIdInput.focus();
          return;
        }
        if (pw.length < 4) {
          signupFeedback.textContent = '비밀번호는 4자 이상 입력해 주세요.';
          signupFeedback.className = 'auth-feedback error';
          signupPwInput.focus();
          return;
        }
        if (pw !== pwConfirm) {
          signupFeedback.textContent = '비밀번호와 비밀번호 확인이 일치하지 않습니다.';
          signupFeedback.className = 'auth-feedback error';
          signupPwConfirmInput.focus();
          return;
        }
        if (!agreeTermsChk.checked) {
          signupFeedback.textContent = '필수 이용약관 및 개인정보 처리방침에 동의해 주세요.';
          signupFeedback.className = 'auth-feedback error';
          return;
        }

        const users = getStoredUsers();
        if (users.some((u) => u.id === id)) {
          signupFeedback.textContent = '이미 가입된 아이디입니다. 다른 아이디를 입력해 주세요.';
          signupFeedback.className = 'auth-feedback error';
          signupIdInput.focus();
          return;
        }

        const newUser = { id, pw, nickname, provider: '일반회원' };
        users.push(newUser);
        saveStoredUsers(users);
        setActiveUser({ id: newUser.id, nickname: newUser.nickname, provider: '일반회원' });

        signupForm.reset();
        location.href = MYPAGE_URL;
      });

      // 일반 로그인
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = loginIdInput.value.trim();
        const pw = loginPwInput.value.trim();

        if (!id || !pw) {
          loginFeedback.textContent = '아이디와 비밀번호를 모두 입력해 주세요.';
          loginFeedback.className = 'auth-feedback error';
          return;
        }

        const users = getStoredUsers();
        const matched = users.find((u) => u.id === id && u.pw === pw);

        if (!matched) {
          loginFeedback.textContent = '아이디 또는 비밀번호가 일치하지 않습니다. 회원가입을 먼저 진행해 보세요.';
          loginFeedback.className = 'auth-feedback error';
          return;
        }

        setActiveUser({
          id: matched.id,
          nickname: matched.nickname,
          provider: matched.provider || '일반회원'
        });
        loginFeedback.textContent = '';
        loginForm.reset();
        location.href = MYPAGE_URL;
      });

      // 카카오 간편로그인
      if (kakaoLoginBtn) {
        kakaoLoginBtn.addEventListener('click', () => {
          setActiveUser({
            id: 'kakao_ipdeok',
            nickname: '카카오입덕러',
            provider: '카카오 간편로그인'
          });
          location.href = MYPAGE_URL;
        });
      }

      // 네이버 간편로그인
      if (naverLoginBtn) {
        naverLoginBtn.addEventListener('click', () => {
          setActiveUser({
            id: 'naver_ipdeok',
            nickname: '네이버입덕러',
            provider: '네이버 간편로그인'
          });
          location.href = MYPAGE_URL;
        });
      }
    })();
  </script>
</body>
</html>

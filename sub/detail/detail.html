<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 상세 & 옵션 선택 - 입덕볶이</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="css/detail.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .combo-tip-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: #FFF5F5;
      border: 1px solid #FFD6D6;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      line-height: 1.45;
      color: #333333;
    }
    .combo-tip-badge {
      flex-shrink: 0;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: #E52528;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
    }
    .spice-sub-desc {
      display: block;
      font-size: 11px;
      color: #777777;
      margin-top: 2px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="site-header">
      <div class="header-left">
        <a href="../lists/lists.html" class="btn-back" aria-label="뒤로가기">←</a>
        <a href="../../index.html" class="logo-link">
          <img src="../../Imgs/logo-mascot.png" alt="입덕볶이 로고" class="logo-img">
          <span class="logo-text">입덕볶이</span>
        </a>
      </div>
      <div class="header-actions">
        <a href="../login/login.html" class="user-icon-btn" id="headerUserBtn" aria-label="로그인">
          <i data-lucide="user"></i>
        </a>
        <a href="../cart/cart.html" class="cart-icon-btn" aria-label="장바구니">
          <i data-lucide="shopping-cart"></i>
          <span class="cart-badge">0</span>
        </a>
        <button type="button" class="hamburger-btn" id="openMenuBtn" aria-label="전체 메뉴">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="slide-drawer" id="slideDrawer">
      <div>
        <div class="drawer-top">
          <div class="drawer-brand">
            <img src="../../Imgs/logo-mascot.png" alt="로고" class="logo-img">
            <span class="drawer-member-name" id="drawerUserName" hidden></span>
          </div>
          <button type="button" class="drawer-close" id="closeMenuBtn">&times;</button>
        </div>
        <nav class="drawer-nav">
          <a href="../lists/lists.html"><span>메뉴</span><span>›</span></a>
          <a href="#"><span>소개</span><span>›</span></a>
          <a href="#"><span>커뮤니티</span><span>›</span></a>
          <a href="../login/login.html"><span>로그인</span><span>›</span></a>
          <a href="../mypage/mypage.html"><span>마이페이지</span><span>›</span></a>
        </nav>
      </div>
      <div class="drawer-footer">
        <strong>입덕볶이 고객센터</strong>
        영업시간 11:00 ~ 23:30
      </div>
    </aside>

    <div class="detail-hero">
      <img id="detailImg" src="../../Imgs/tteokbokki-main.png" alt="떡볶이 메뉴 사진">
    </div>

    <section class="detail-info">
      <div class="detail-title-row">
        <h1 id="detailName">눈꽃치즈 매운 떡볶이</h1>
        <span class="detail-base-price" id="detailPrice">10,500원</span>
      </div>
      <p class="detail-desc" id="detailDesc">
        화끈하게 매운 특제 양념 위로 100% 자연산 모짜렐라 눈꽃치즈를 아낌없이 올렸습니다. 매콤함과 고소한 치즈의 완벽한 단짠·맵느 조합을 경험해 보세요.
      </p>
      <div class="combo-tip-box" id="comboTipBox" hidden>
        <span class="combo-tip-badge">꿀조합 TIP</span>
        <span id="comboTipText"></span>
      </div>
    </section>

    <section class="option-group">
      <div class="option-header">
        <h2 id="primaryOptionTitle">맛 선택</h2>
        <span class="required-pill" id="primaryOptionPill">필수</span>
      </div>
      <div id="primaryOptionList"></div>
    </section>

    <section class="option-group">
      <div class="option-header">
        <h2 id="extraOptionTitle">토핑 추가</h2>
        <span class="optional-pill">선택</span>
      </div>
      <div id="extraOptionList"></div>
    </section>

    <div class="detail-bottom-bar">
      <button type="button" class="btn-action-red" id="addToCartBtn">
        10,500원 장바구니 담기
      </button>
    </div>
  </div>

  <script src="../../app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const menuKey = params.get('menu') || 'cheese';
    const currentMenu = MENU_DATA[menuKey] || MENU_DATA.cheese;

    const isSide = currentMenu.category === 'side';
    const isDrink = currentMenu.category === 'drink';

    const detailImgEl = document.getElementById('detailImg');
    detailImgEl.src = resolveAsset(currentMenu.img);
    detailImgEl.alt = currentMenu.name;

    document.getElementById('detailName').textContent = currentMenu.name;
    document.getElementById('detailPrice').textContent = formatPrice(currentMenu.price);
    document.getElementById('detailDesc').textContent = currentMenu.desc;

    const comboTipBox = document.getElementById('comboTipBox');
    const comboTipText = document.getElementById('comboTipText');
    if ((isSide || isDrink) && currentMenu.comboTip) {
      comboTipText.textContent = currentMenu.comboTip;
      comboTipBox.hidden = false;
    }

    const primaryTitleEl = document.getElementById('primaryOptionTitle');
    const primaryPillEl = document.getElementById('primaryOptionPill');
    const primaryListEl = document.getElementById('primaryOptionList');
    const extraTitleEl = document.getElementById('extraOptionTitle');
    const extraListEl = document.getElementById('extraOptionList');

    const defaultSideSauces = [
      { name: '기본 간장소스', price: 0 },
      { name: '매콤달콤 양념소스', price: 500 },
      { name: '허니머스타드 소스', price: 500 },
      { name: '체다 치즈 디핑소스', price: 1000 }
    ];

    const rawSideSauces = Array.isArray(currentMenu.sauces)
      ? currentMenu.sauces.map((s) =>
          typeof s === 'string' ? { name: s, price: 0 } : { name: s.name, price: Number(s.price || 0) }
        )
      : defaultSideSauces;

    const primaryOptions = isDrink
      ? (currentMenu.drinkOptions || ['시원하게 (기본)', '얼음 가득']).map((label, idx) => ({
          value: label,
          label: idx === 0 ? `🧊 ${label}` : `❄️ ${label}`,
          price: 0,
          checked: idx === 0
        }))
      : isSide
        ? rawSideSauces.map((s) => ({
            value: s.name,
            label: `🥄 ${s.name}`,
            price: s.price,
            checked: false
          }))
        : [
            {
              value: '순한맛',
              label: '🌶️ 순한맛',
              subDesc: '진라면 순한맛~신라면 살짝 아래 정도의 은은한 매콤함',
              price: 0,
              checked: false
            },
            {
              value: '보통맛',
              label: '🌶️🌶️ 보통맛',
              subDesc: '신라면과 비슷한 수준의 기분 좋은 매콤달콤함',
              price: 0,
              checked: true
            },
            {
              value: '매운맛',
              label: '🌶️🌶️🌶️ 매운맛',
              subDesc: '신라면보다 확실히 맵고 불닭볶음면 앞단계 수준의 화끈함',
              price: 0,
              checked: false
            },
            {
              value: '아주 매운맛',
              label: '🔥 아주 매운맛',
              subDesc: '불닭볶음면 이상급의 강렬한 매운맛 (매운맛 마니아 추천)',
              price: 0,
              checked: false
            }
          ];

    const extraOptions = isDrink
      ? (currentMenu.drinkExtras || [
          { name: '얼음컵 추가', price: 500 },
          { name: '빨대 포함', price: 0 }
        ]).map((opt) => ({
          value: opt.name,
          label: opt.name.includes('얼음') ? `🧊 ${opt.name}` : `🥤 ${opt.name}`,
          price: Number(opt.price || 0)
        }))
      : isSide
        ? (currentMenu.extraOptions || [
            { name: '눈꽃 모짜렐라 치즈 추가', price: 1500 },
            { name: '단무지 추가', price: 500 }
          ]).map((opt) => ({
            value: opt.name,
            label: opt.name.includes('치즈') ? `🧀 ${opt.name}` : `🥢 ${opt.name}`,
            price: Number(opt.price || 0)
          }))
        : [
            { value: '치즈 추가', label: '🧀 치즈 추가', price: 1500 },
            { value: '분모자 추가', label: '🥢 분모자 추가', price: 2000 },
            { value: '주먹밥 추가', label: '🍙 주먹밥 추가', price: 1500 }
          ];

    primaryTitleEl.textContent = isDrink ? '온도 / 얼음 선택' : (isSide ? '찍먹 소스 선택' : '맛 선택');
    extraTitleEl.textContent = isDrink ? '곁들임 옵션' : (isSide ? '사이드 추가 옵션' : '토핑 추가');

    if (isSide) {
      primaryPillEl.textContent = '선택';
      primaryPillEl.className = 'optional-pill';
    } else {
      primaryPillEl.textContent = '필수';
      primaryPillEl.className = 'required-pill';
    }

    if (isSide) {
      primaryListEl.innerHTML = primaryOptions.map((opt) => `
        <label class="option-item">
          <div class="option-left">
            <input type="checkbox" class="sauce-chk topping-chk" value="${opt.value}" data-price="${opt.price}">
            <span>${opt.label}</span>
          </div>
          <span class="option-price">+${formatPrice(opt.price)}</span>
        </label>
      `).join('');
    } else {
      primaryListEl.innerHTML = primaryOptions.map((opt) => `
        <label class="option-item">
          <div class="option-left">
            <input type="radio" name="spice" value="${opt.value}" ${opt.checked ? 'checked' : ''}>
            <div>
              <span>${opt.label}</span>
              ${opt.subDesc ? `<small class="spice-sub-desc">${opt.subDesc}</small>` : ''}
            </div>
          </div>
          <span class="option-price">+0원</span>
        </label>
      `).join('');
    }

    extraListEl.innerHTML = extraOptions.map((opt) => `
      <label class="option-item">
        <div class="option-left">
          <input type="checkbox" class="topping-chk" value="${opt.value}" data-price="${opt.price}">
          <span>${opt.label}</span>
        </div>
        <span class="option-price">+${formatPrice(opt.price)}</span>
      </label>
    `).join('');

    const toppingChks = document.querySelectorAll('.topping-chk');
    const addToCartBtn = document.getElementById('addToCartBtn');

    function calcTotal() {
      let extra = 0;
      toppingChks.forEach((chk) => {
        if (chk.checked) extra += Number(chk.dataset.price);
      });
      const total = currentMenu.price + extra;
      addToCartBtn.textContent = `${formatPrice(total)} 장바구니 담기`;
      return total;
    }

    toppingChks.forEach((chk) => chk.addEventListener('change', calcTotal));
    calcTotal();

    addToCartBtn.addEventListener('click', () => {
      const selectedSpice = isSide
        ? '기본'
        : (document.querySelector('input[name="spice"]:checked')?.value || primaryOptions[0].value);

      const selectedToppings = [];
      let extra = 0;

      toppingChks.forEach((chk) => {
        if (chk.checked) {
          const priceNum = Number(chk.dataset.price);
          selectedToppings.push(
            priceNum > 0 ? `${chk.value}(+${formatPrice(priceNum)})` : `${chk.value}`
          );
          extra += priceNum;
        }
      });

      const cart = getCart();
      cart.push({
        id: currentMenu.id,
        name: currentMenu.name,
        img: currentMenu.img,
        basePrice: currentMenu.price,
        spice: selectedSpice,
        toppings: selectedToppings,
        unitPrice: currentMenu.price + extra,
        qty: 1
      });
      saveCart(cart);
      location.href = '../cart/cart.html';
    });
  </script>
</body>
</html>

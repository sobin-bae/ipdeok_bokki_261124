<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 - 입덕볶이</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="css/payment_finish.css">
</head>
<body>
  <div class="app-wrap">
    <header class="site-header">
      <div class="header-left">
        <a href="../../index.html" class="logo-link">
          <img src="../../Imgs/logo-mascot.png" alt="입덕볶이 로고" class="logo-img">
          <span class="logo-text">입덕볶이</span>
        </a>
      </div>
      <div class="header-actions">
        <button type="button" class="hamburger-btn" id="openMenuBtn" aria-label="전체 메뉴">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="slide-drawer" id="slideDrawer">
      <div>
        <div class="drawer-top">
          <div class="drawer-brand">
            <img src="../../Imgs/logo-mascot.png" alt="로고" class="logo-img">
            <span>입덕볶이 메뉴</span>
          </div>
          <button type="button" class="drawer-close" id="closeMenuBtn">&times;</button>
        </div>
        <nav class="drawer-nav">
          <a href="../../index.html"><span>🏠 홈으로</span><span>›</span></a>
          <a href="../lists/lists.html"><span>🍲 전체 메뉴 리스트</span><span>›</span></a>
          <a href="../detail/detail.html?menu=cheese"><span>🌶️ 인기 메뉴 상세보기</span><span>›</span></a>
          <a href="../cart/cart.html"><span>🛒 장바구니 확인</span><span>›</span></a>
          <a href="../payment/payment.html"><span>💳 결제하기</span><span>›</span></a>
          <a href="payment_finish.html"><span>✅ 결제 완료</span><span>›</span></a>
        </nav>
      </div>
      <div class="drawer-footer">
        <strong>입덕볶이 고객센터</strong>
        영업시간 11:00 ~ 23:30
      </div>
    </aside>

    <section class="complete-hero">
      <div class="animated-check-wrap">
        <div class="check-ring"></div>
        <div class="check-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <h1>결제 요청 처리완료</h1>
      <p>주문이 정상적으로 접수되어 맛있게 조리를 시작했습니다!</p>
    </section>

    <section class="receipt-section">
      <div class="receipt-card">
        <div class="receipt-row">
          <span>주문 번호</span>
          <strong>20261124-0042</strong>
        </div>
        <div class="receipt-row">
          <span>주문 상품</span>
          <strong id="doneMenuTitle">눈꽃치즈 매운 떡볶이</strong>
        </div>
        <div class="receipt-row">
          <span>결제 수단</span>
          <strong id="doneMethod">토스페이</strong>
        </div>
        <div class="receipt-divider"></div>
        <div class="receipt-row total">
          <span>최종 결제 금액</span>
          <strong id="donePrice">10,500원</strong>
        </div>
      </div>
    </section>

    <section class="complete-bottom-area">
      <p class="notice-text">
        * 조리가 시작된 이후에는 주문 취소 및 옵션 변경이 어려울 수 있습니다.
      </p>
      <div class="notice-divider"></div>
      <a href="../../index.html" class="btn-confirm" id="finishConfirmBtn">확인</a>
    </section>
  </div>

  <script src="../../app.js"></script>
  <script>
    try {
      const lastOrder = JSON.parse(localStorage.getItem('ipdeok_last_order'));
      if (lastOrder) {
        document.getElementById('doneMenuTitle').textContent = lastOrder.menuTitle;
        document.getElementById('doneMethod').textContent = lastOrder.method;
        document.getElementById('donePrice').textContent = formatPrice(lastOrder.totalPrice);
      }
    } catch (e) {}

    document.getElementById('finishConfirmBtn').addEventListener('click', () => {
      clearCart();
    });
  </script>
</body>
</html>
